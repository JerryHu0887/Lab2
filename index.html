<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- This is for making the page fit different screen sizes. -->

  <title>Events in Motion</title>

  <link rel="stylesheet" href="css.css">
  <!-- This is for connecting the CSS file. -->
</head>


<body id="page">

  <main class="console" id="console">
    <!-- This is the main interactive area. -->

    <p class="label">CCT 360 INTERACTIVE SYSTEM</p>

    <h1 id="title">SYSTEM STANDBY</h1>
    <!-- This title can be changed with JavaScript. -->


    <div class="display">

      <p id="message">
        Waiting for user input.
      </p>
      <!-- This message can be changed with JavaScript. -->

    </div>


    <div class="controls">
      <!-- These buttons control the main interface. -->

      <button id="activateButton">
        ACTIVATE
      </button>

      <button id="signalButton">
        SIGNAL
      </button>

      <button id="checkButton">
        SYSTEM CHECK
      </button>

    </div>


    <div class="reset-area">
      <!-- This places the reset button below the other controls. -->

      <button id="resetButton">
        RESET
      </button>

    </div>


    <p id="status">
      STATUS: READY
    </p>
    <!-- This shows the current system status. -->

  </main>


  <script src="script.js"></script>
  <!-- This is for connecting the JavaScript file. -->

</body>

</html>
