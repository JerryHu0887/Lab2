<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <title>Launch Control</title>

  <link rel="stylesheet" href="css.css">
  <!-- This connects the CSS file. -->

</head>


<body id="page">


  <div class="console" id="console">
    <!-- This is the main launch control panel. -->


    <p class="label">
      CCT 360 LAUNCH CONTROL
    </p>


    <h1 id="title">
      MISSION STANDBY
    </h1>
    <!-- This title changes during the launch process. -->


    <div class="display" id="display">
      <!-- This area shows the current mission message. -->

      <p id="message">
        Rocket systems are waiting for activation.
      </p>

    </div>


    <div class="controls">
      <!-- These are the three preparation controls. -->

      <button id="powerButton">
        POWER ON
      </button>

      <button id="engineButton">
        START ENGINE
      </button>

      <button id="checkButton">
        LAUNCH CHECK
      </button>

    </div>


    <div class="launch-area">
      <!-- This is the final launch control. -->

      <button id="launchButton">
        LAUNCH
      </button>

    </div>


    <div class="reset-area">
      <!-- This places the reset button below the launch button. -->

      <button id="resetButton">
        RESET
      </button>

    </div>


    <p id="status">
      STATUS: READY
    </p>
    <!-- This shows the current rocket status. -->


  </div>


  <script src="script.js"></script>
  <!-- This connects the JavaScript file. -->


</body>

</html>
